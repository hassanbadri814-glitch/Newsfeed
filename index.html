function hash(str){ let h = 0; for(let i=0;i<str.length;i++){ h = ((h<<5)-h) + str.charCodeAt(i); h |= 0; } return h.toString(36); }
function saveTrCache(){
  try{
    const keys = Object.keys(trCache);
    if(keys.length > 5000){
      const fresh = {};
      keys.slice(-3000).forEach(k => fresh[k] = trCache[k]);
      trCache = fresh;
    }
    localStorage.setItem(TR_KEY, JSON.stringify(trCache));
  }catch(e){}
}

async function googleTranslate(text, target){
  const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" + encodeURIComponent(target) + "&dt=t&q=" + encodeURIComponent(text);
  const r = await fetch(url);
  if(!r.ok) throw new Error("google-" + r.status);
  const data = await r.json();
  return Array.isArray(data?.[0]) ? data[0].map(x => x[0] || "").join("") : text;
}
async function myMemoryTranslate(text, target){
  const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=autodetect|" + target;
  const r = await fetch(url);
  if(!r.ok) throw new Error("mymemory-" + r.status);
  const data = await r.json();
  if(data && data.responseData && data.responseData.translatedText) return data.responseData.translatedText;
  throw new Error("mymemory-empty");
}
async function gTranslate(text, target){
  if(!text) return "";
  const t = text.slice(0, 450);
  const key = target + ":" + hash(t);
  if(trCache[key]) return trCache[key];
  try{ const out = await googleTranslate(t, target); trCache[key] = out; saveTrCache(); return out; }catch(e){}
  try{ const out = await myMemoryTranslate(t, target); trCache[key] = out; saveTrCache(); return out; }catch(e){}
  return t;
}

let trActive = 0, trQueue = [], trDone = 0, trTotal = 0;
function trEnqueue(fn){
  trTotal++;
  return new Promise((res, rej) => { trQueue.push({fn, res, rej}); trPump(); });
}
function trPump(){
  while(trActive < 3 && trQueue.length){       /* 3 i.p.v. 5 → minder rate-limit */
    const {fn, res, rej} = trQueue.shift();
    trActive++;
    fn().then(res).catch(rej).finally(() => {
      trActive--; trDone++; updateTrStatus(); trPump();
    });
  }
}
function updateTrStatus(){
  if(trTotal === 0){ trStatusEl.style.display = "none"; return; }
  trStatusEl.style.display = "inline-flex";
  trCountEl.textContent = trDone + "/" + trTotal;
  if(trDone >= trTotal && trQueue.length === 0){
    setTimeout(() => { trTotal = 0; trDone = 0; trStatusEl.style.display = "none"; }, 3000);
  }
}
function resetTrCounters(){ trTotal = 0; trDone = 0; trStatusEl.style.display = "none"; }

/* ================= HELPERS ================= */
function stripHtml(s){ return (s||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim(); }
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function timeAgo(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return "";
  const diff = (Date.now() - d.getTime())/1000;
  if(diff < 60) return "net nu";
  if(diff < 3600) return Math.floor(diff/60) + " min geleden";
  if(diff < 86400) return Math.floor(diff/3600) + " u geleden";
  if(diff < 604800) return Math.floor(diff/86400) + " d geleden";
  return d.toLocaleDateString("nl-NL", { day:"numeric", month:"short" });
}
function readTime(text){ return Math.max(1, Math.round(((text||"").split(/\s+/).length) / 200)); }
function trKeyFor(text){ return targetLang + ":" + hash((text||"").slice(0,450)); }
function getCachedTr(text){ return trCache[trKeyFor(text)] || ""; }
function isArabic(t){ return /[\u0600-\u06FF]/.test(t||""); }
function needsTranslation(lang){ return lang !== "nl"; }
function isNewArticle(it){
  if(!lastVisit) return false;
  const t = new Date(it.date).getTime();
  return !isNaN(t) && t > lastVisit;
}

  const t = (title + " " + desc).toLowerCase();

  if(/\b(gaza|rafah|khan younis|hamas|palestin|west bank|netanyahu|tel aviv|jerusalem|idf|hebron|jenin|nablus|ramallah)\b/.test(t)) return "gaza";
  if(/\b(lebanon|lebanese|beirut|hezbollah|nasrallah|hizbullah|sidon|tripoli|tyre)\b/.test(t)) return "lebanon";
  if(/\b(iran|iranian|tehran|irgc|khamenei|persian gulf|pezeshkian)\b/.test(t)) return "iran";
  if(/\b(syria|syrian|damascus|assad|idlib|aleppo|homs|raqqa|sharaa)\b/.test(t)) return "syria";
  if(/\b(yemen|yemeni|houthi|sanaa|aden|taiz|hodeidah)\b/.test(t)) return "yemen";
  if(/\b(ukraine|ukrainian|kyiv|kiev|zelensky|kharkiv|odesa|donbas|crimea|donetsk|luhansk|mariupol|putin|kremlin|moscow)\b/.test(t)) return "ukraine";
  if(/\b(sudan|sudanese|khartoum|darfur|rsf|omdurman)\b/.test(t)) return "sudan";
  if(/\b(morocco|moroccan|maroc|rabat|casablanca|marrakech|agadir|fes|tanger|western sahara|sahara|akhannouch)\b/.test(t)) return "maroc";

  return fallbackCat || "algemeen";
}

  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}
async function fetchFeedData(url, timeoutMs = TIMEOUT_MS){
  let attempts = [];
  if(url.startsWith("rsshub://")){
    attempts = RSSHUB_MIRRORS.map(m => m + "/" + url.slice(9));
  } else {
    attempts = [url];
  }
  for(const u of attempts){
    try{
      const r = await fetchWithTimeout(fetch(PROXY_URL + encodeURIComponent(u)), timeoutMs);
      const data = await r.json();
      if(data && Array.isArray(data.items) && data.items.length) return data;
    }catch(e){ continue; }
  }
  throw new Error("failed");
}

function processFeedResult(f, data){
  return data.items.slice(0, PER_FEED).map(it => {
    const rawDesc = it.description || it.content || "";
    const img = it.thumbnail || it.enclosure?.link ||
      (rawDesc.match(/<img[^>]+src="([^"]+)"/i)?.[1]) ||
      (it.content||"").match(/<img[^>]+src="([^"]+)"/i)?.[1] || "";
    const titleClean = stripHtml(it.title || "");
    const descClean  = stripHtml(rawDesc).slice(0, 400);
    const loc = detectLocation(titleClean, descClean, f.lat, f.lon);
    return {
      title: titleClean, link: it.link || "#", desc: descClean,
      img, date: it.pubDate || "",
      source: f.name,
      cat: detectTopic(titleClean, descClean, f.cat),
      lang: f.lang,
      lat: loc.lat, lon: loc.lon
    };
  });
}

function titleKey(title){
  return (title||"").toLowerCase().replace(/[^a-z0-9 ]/g, "")
    .split(/\s+/).filter(w => w.length > 3).slice(0, 6).join(" ");
}
function dedupe(items){
  const map = new Map();
  items.forEach(it => {
    const key = titleKey(it.title);
    if(!key){ map.set(it.link + Math.random(), it); return; }
    if(!map.has(key)) map.set(key, { ...it, sources: [it.source] });
    else {
      const e = map.get(key);
      if(!e.sources.includes(it.source)) e.sources.push(it.source);
    }
  });
  return Array.from(map.values());
}

/* ================= BREAKING DETECT ================= */
function extractBreakingKeywords(title, desc){
  const t = (title + " " + (desc || "")).toLowerCase();
  const actions = new Set(), locations = new Set();
  ACTION_KEYWORDS.forEach(kw => { if(t.includes(kw)) actions.add(kw); });
  LOCATION_KEYWORDS.forEach(kw => { if(t.includes(kw)) locations.add(kw); });
  return { actions, locations };
}
function areRelatedArticles(a, b){
  const ka = extractBreakingKeywords(a.title, a.desc);
  const kb = extractBreakingKeywords(b.title, b.desc);
  let sa = 0; ka.actions.forEach(kw => { if(kb.actions.has(kw)) sa++; });
  let sl = 0; ka.locations.forEach(kw => { if(kb.locations.has(kw)) sl++; });
  return (sa >= 2) || (sa >= 1 && sl >= 1);
}
function detectBreaking(items){
  const now = Date.now();
  const recent = items.filter(it => {
    const age = now - new Date(it.date).getTime();
    return !isNaN(age) && age <= BREAKING_MS;
  }).slice(0, 40);   /* cap om O(n²) te beperken */
  if(recent.length < 2) return null;
  const groups = [], used = new Set();
  recent.forEach((a, i) => {
    if(used.has(i)) return;
    const g = { items: [a], sources: new Set([a.source]) };
    used.add(i);
    recent.forEach((b, j) => {
      if(used.has(j) || i === j) return;
      if(areRelatedArticles(a, b)){ g.items.push(b); g.sources.add(b.source); used.add(j); }
    });
    if(g.sources.size >= 2) groups.push(g);
  });
  if(!groups.length) return null;
  groups.sort((a, b) => b.sources.size - a.sources.size);
  return { item: groups[0].items[0], sources: [...groups[0].sources] };
}
function showBreaking(info){
  if(Date.now() - lastBreakingShown < BREAKING_COOLDOWN) return;
  lastBreakingShown = Date.now();
  breakingCount.textContent = info.sources.length;
  const tr = getCachedTr(info.item.title) || info.item.title;
  breakingTitle.textContent = tr.slice(0, 180);
  breakingTitle.setAttribute("dir", isArabic(info.item.title) ? "rtl" : "ltr");
  breakingMeta.textContent = info.sources.join(" · ");
  breakingBanner.classList.add("show");
  setTimeout(() => breakingBanner.classList.remove("show"), 30000);
}

function loadCache(){

    if(!raw) return [];
    const data = JSON.parse(raw);
    if(!data.items || !Array.isArray(data.items)) return [];
    if(Date.now() - data.time > 2 * 60 * 60 * 1000) return [];
    return data.items;
  }catch(e){ return []; }
}

/* ================= LOAD FEEDS ================= */
let loadSession = 0;

async function loadFeeds(isAuto = false){
  const session = ++loadSession;
  const activeFeeds = FEEDS.filter(f => !isDisabled(f.name));

  const cached = loadCache();
  if(cached.length && !isAuto){
    allItems = cached;
    render(); renderTicker();
    statusEl.textContent = `${cached.length} gecachte berichten · vers ophalen...`;
    statusDot.className = "dot loading";
    isFirstLoad = false;
  } else if(isFirstLoad){
    statusEl.textContent = "Bronnen ophalen...";
  }

  if(!isAuto){ refreshBtn.classList.add("spin"); resetTrCounters(); }

  const sorted = [...activeFeeds].sort((a, b) => {
    const aP = HIGH_PRIORITY.includes(a.name) ? 0 : 1;
    const bP = HIGH_PRIORITY.includes(b.name) ? 0 : 1;
    return aP - bP;
  });

  const collected = [], collectedLinks = new Set(), failed = [];
  let totalOk = 0, totalTry = 0, firstRenderDone = false;
  const totalCount = sorted.length;

  /* throttled render — max ~3x per seconde */
  let renderScheduled = false, lastRender = 0;
  function doPartialRender(){
    lastRender = Date.now();
    const dd = dedupe(collected);
    dd.sort((a, b) => new Date(b.date) - new Date(a.date));
    if(dd.length) allItems = dd;
    statusEl.textContent = `${allItems.length} berichten · ${totalOk}/${totalCount} bronnen`;
    statusDot.className = totalTry < totalCount ? "dot loading" : "dot ok";
    statSources.textContent = `${totalOk}/${FEEDS.length}`;
    render();
    renderTicker();
    if(!firstRenderDone && dd.length){
      firstRenderDone = true;
      renderHero();
      isFirstLoad = false;
    }
  }
  function scheduleRender(){
    const now = Date.now();
    if(now - lastRender > 400){ doPartialRender(); return; }
    if(renderScheduled) return;
    renderScheduled = true;
    setTimeout(() => { renderScheduled = false; doPartialRender(); }, 400 - (now - lastRender));
  }

  const processOne = async (f) => {
    if(session !== loadSession) return;
    totalTry++;
    try{
      const data = await fetchFeedData(f.url);
      recordHealth(f.name, true);
      processFeedResult(f, data).forEach(it => {
        const key = (it.link || it.title).toLowerCase().trim();
        if(!collectedLinks.has(key)){ collectedLinks.add(key); collected.push(it); }
      });
      totalOk++;
      scheduleRender();
    }catch(e){
      recordHealth(f.name, false);
      failed.push(f.name);
    }
  };

  progressBar.classList.remove("hidden");
  progressBar.style.width = "15%";

  /* concurrency 8 → snelle load, niet te agressief */
  const CONCURRENCY = 8;
  let idx = 0;
  async function worker(){
    while(idx < sorted.length && session === loadSession){
      const f = sorted[idx++];
      await processOne(f);
      progressBar.style.width = (15 + Math.round((idx / sorted.length) * 80)) + "%";
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, () => worker()));
  if(session !== loadSession) return;

  /* finale render */
  const finalDeduped = dedupe(collected);
  finalDeduped.sort((a, b) => new Date(b.date) - new Date(a.date));
  if(finalDeduped.length) allItems = finalDeduped;
  failedFeeds = failed;
  saveHealth();
  saveCache();

  statSources.textContent = `${totalOk}/${FEEDS.length}`;
  statWar.textContent = allItems.filter(x => x.cat === "war").length;
  statNew.textContent = allItems.filter(isNewArticle).length;

  const breaking = detectBreaking(allItems);
  if(breaking && firstRenderDone) showBreaking(breaking);

  if(!isAuto && notifEnabled && "Notification" in window && Notification.permission === "granted"){
    if(allItems.length > 0){
      try { new Notification("WAR DESK · Update", { body: allItems[0].title.slice(0, 120), tag: "wardesk" }); } catch(e){}
    }
  }

  /* failed list */
  const disabledNow = [...disabledSources];
  if(failedFeeds.length || disabledNow.length){
    failedCount.textContent = failedFeeds.length + disabledNow.length;
    failedToggle.style.display = "inline-block";
    let msg = '';
    if(failedFeeds.length) msg += `<strong>${failedFeeds.length} bronnen falen nu:</strong> ${failedFeeds.map(escapeHtml).join(" · ")}`;
    if(disabledNow.length){
      if(msg) msg += '<br><br>';
      msg += `<strong>${disabledNow.length} bronnen zijn uitgeschakeld</strong>: ${disabledNow.map(escapeHtml).join(" · ")}`;
      msg += '<br><button class="reset" id="resetHealth">↺ Reset uitgeschakelde bronnen</button>';
    }
    failedList.innerHTML = msg;
    const resetBtn = document.getElementById("resetHealth");
    if(resetBtn) resetBtn.addEventListener("click", () => {
      sourceHealth = {}; disabledSources = new Set(); saveHealth();
      showToast("Bronnen gereset", "↺");
      loadFeeds(false);
    });
  } else {
    failedToggle.style.display = "none";
    failedList.classList.remove("show");
  }

  refreshBtn.classList.remove("spin");
  progressBar.style.width = "100%";
  setTimeout(() => progressBar.classList.add("hidden"), 500);

  populateSources();
  currentPage = 1;
  render(); renderHero(); renderTicker(); renderMap(); updateNavCounts();
  nextRefreshSeconds = REFRESH_MS / 1000;
}

    maroc:"Marokko", mideast:"Midden-Oosten",

/* ================= FILTER ================= */
function getFilteredBase(){
  const q = searchInput.value.toLowerCase().trim();
  const now = Date.now();
  const timeLimit = activeTime === "all" ? Infinity : parseInt(activeTime, 10) * 60 * 60 * 1000;

  let base = allItems.filter(it => {
    if(activeCat === "fav"){ if(!favorites.has(it.link)) return false; }
    else if(activeCat !== "all" && activeCat !== "live" && it.cat !== activeCat) return false;
    if(activeSource !== "all" && it.source !== activeSource) return false;
    if(activeLang !== "all" && it.lang !== activeLang) return false;
    if(timeLimit !== Infinity){
      const age = now - new Date(it.date).getTime();
      if(isNaN(age) || age > timeLimit) return false;
    }
    if(q){
      const hay = (it.title + " " + it.desc + " " + it.source).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(activeSort === "oldest") base.sort((a, b) => new Date(a.date) - new Date(b.date));
  else if(activeSort === "source") base.sort((a, b) => a.source.localeCompare(b.source));
  else if(activeSort === "relevance"){
    base.sort((a, b) => {
      const sa = (a.sources || [a.source]).length;
      const sb = (b.sources || [b.source]).length;
      if(sb !== sa) return sb - sa;
      return new Date(b.date) - new Date(a.date);
    });
  } else base.sort((a, b) => new Date(b.date) - new Date(a.date));

  return base;
}

/* ================= RENDER CARDS ================= */
let currentRender = [];
let lazyObserver = null;

function render(){
  const list = getFilteredBase();
  currentRender = list;

  const titleMap = {
    all:"Laatste berichten", live:"Laatste berichten", fav:"Favorieten",
    war:"Oorlog & conflict", gaza:"Gazastrook", lebanon:"Libanon",
    syria:"Syrië", yemen:"Jemen", iran:"Iran", ukraine:"Oekraïne",
    sudan:"Soedan", maroc:"Marokko", mideast:"Midden-Oosten",
    world:"Wereld", nl:"Nederland", sport:"Sport", business:"Economie",
    tech:"Tech", health:"Gezondheid", algemeen:"Algemeen"
  };
  let title = titleMap[activeCat] || "Laatste berichten";
  if(activeSource !== "all") title = "Bron · " + activeSource;
  if(activeTime !== "all"){
    const labels = { "1":"Laatste uur", "6":"Laatste 6 uur", "24":"Laatste 24 uur", "168":"Laatste week" };
    title += " · " + (labels[activeTime] || "");
  }
  sectionTitle.textContent = title;
  sectionCount.textContent = list.length + " berichten";

  if(!list.length){
    const msg = activeCat === "fav" ? "Nog geen favorieten — klik op ☆ bij een artikel" : "Geen berichten";
    const hint = activeCat === "fav" ? "Sla interessante artikelen op om ze hier terug te vinden." : "";
    feedEl.innerHTML = `<div class="empty">
      <div class="big">${activeCat === 'fav' ? '☆' : '◌'}</div>
      <div class="msg">${msg}</div>
      ${hint ? `<div class="hint">${hint}</div>` : ''}
    </div>`;
    return;
  }

  const toShow = list.slice(0, currentPage * PAGE_SIZE);
  const hasMore = list.length > toShow.length;

  let html = toShow.map((it, i) => cardHtml(it, i)).join("");
  if(hasMore){
    html += `<div class="load-more">
      <button id="loadMoreBtn">Meer laden</button>
      <span class="progress">${toShow.length} van ${list.length} getoond</span>
    </div>`;
  }
  feedEl.innerHTML = html;

  const loadMoreBtn = document.getElementById("loadMoreBtn");
  if(loadMoreBtn) loadMoreBtn.addEventListener("click", () => { currentPage++; render(); });

  if(lazyObserver) lazyObserver.disconnect();
  lazyObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting){
        const idx = parseInt(e.target.dataset.idx, 10);
        lazyObserver.unobserve(e.target);
        scheduleTranslation(currentRender[idx], idx);
      }
    });
  }, { rootMargin: "300px" });
  toShow.forEach((_, i) => {
    const el = document.getElementById("wcard-" + i);
    if(el) lazyObserver.observe(el);
  });
}

function cardHtml(it, i){
  const cachedTitle = getCachedTr(it.title);
  const cachedDesc  = getCachedTr(it.desc);
  const rtl = it.lang === "ar" || isArabic(it.title);
  const dispTitle = cachedTitle || it.title;
  const dispDesc  = cachedDesc  || it.desc;
  const translating = !cachedTitle && needsTranslation(it.lang);

  const img = it.img
    ? `<img src="${escapeHtml(it.img)}" alt="" loading="lazy" onerror="this.parentElement.style.background='var(--bg-3)'; this.remove();">`
    : "";

  const isWar = it.cat === "war";
  const isRead = readArticles.has(it.link);
  const isFav = favorites.has(it.link);
  const isNew = isNewArticle(it);

  const sources = it.sources || [it.source];
  const multiSrc = sources.length > 1;

  const classes = [isWar?'war':'', isRead?'read':'', isFav?'is-fav':''].filter(Boolean).join(' ');
  const catLabel = getCatLabel(it.cat);
  const minutes = readTime(dispDesc);

  const metaLine = `
    <span class="card-source">${escapeHtml(it.source)}</span>
    <span class="card-sep">·</span>
    <span>${catLabel}</span>
    <span class="card-sep">·</span>
    <span>${timeAgo(it.date)}</span>
    ${isNew ? `<span class="new-badge">NEW</span>` : ''}
    ${multiSrc ? `<span class="card-multi" data-sources='${escapeHtml(JSON.stringify(sources))}'>${sources.length}× bronnen</span>` : ''}
  `;

  return `
    <article id="wcard-${i}" data-idx="${i}" data-link="${escapeHtml(it.link)}" class="${classes}" dir="${rtl?'rtl':'ltr'}">
      <div class="card-thumb">${img}</div>
      <div class="card-actions">
        <button class="icon-btn fav ${isFav?'active':''}" data-fav="${escapeHtml(it.link)}" title="${isFav?'Verwijder favoriet':'Voeg toe aan favorieten'}">${isFav?'★':'☆'}</button>
        <button class="icon-btn share" data-share="${escapeHtml(it.link)}" title="Delen">⇗</button>
      </div>
      <div class="card-body">
        <div class="card-meta">${metaLine}</div>
        <h3 class="card-title ${translating?'translating':''}" data-role="title">${escapeHtml(dispTitle)}</h3>
        ${dispDesc ? `<p class="card-desc" data-role="desc" dir="${rtl?'rtl':'ltr'}">${escapeHtml(dispDesc)}${dispDesc.length>=280?"…":""}</p>` : ""}
        <div class="card-footer">
          <span>${minutes} min leestijd</span>
          <span class="arrow">Lees verder →</span>
        </div>
      </div>
    </article>`;
}

/* ================= FEED CLICK ================= */
feedEl.addEventListener("click", e => {

    e.stopPropagation();

  }

    e.stopPropagation();

    const url = shareBtn.dataset.share;
    const title = currentRender.find(x => x.link === url)?.title || "WAR DESK";
    if(navigator.share){
      navigator.share({ title, url }).catch(() => {});

      navigator.clipboard.writeText(url).then(() => showToast("Link gekopieerd", "🔗"));
    } else {
      showToast("Delen niet ondersteund", "⚠");
    }
    return;
  }

  /* multi-source badge */

  /* open card */

    if(it){
      markAsRead(it.link);
      window.open(it.link, "_blank");
    }
  }
});

function showSources(sources){
  srcList.innerHTML = sources.map(s => `<li>${escapeHtml(s)}</li>`).join("");
  srcTitle.textContent = sources.length + " bronnen melden dit verhaal";
  srcPopup.classList.add("show");
}
srcClose.addEventListener("click", () => srcPopup.classList.remove("show"));
srcPopup.addEventListener("click", e => { if(e.target === srcPopup) srcPopup.classList.remove("show"); });

function markAsRead(link){
  if(!readArticles.has(link)){
    readArticles.add(link);
    try { localStorage.setItem(READ_KEY, JSON.stringify([...readArticles])); } catch(e){}
  }
}

/* ================= TRANSLATE LAZY ================= */
function scheduleTranslation(it, idx){
  if(!it) return;
  if(!needsTranslation(it.lang)) return;
  const card = document.getElementById("wcard-" + idx);
  if(!card) return;
  const titleEl = card.querySelector('[data-role="title"]');
  const descEl  = card.querySelector('[data-role="desc"]');

  if(it.title && !getCachedTr(it.title)){
    trEnqueue(() => gTranslate(it.title, targetLang))
      .then(tr => {
        if(!tr || !titleEl) return;
        titleEl.textContent = tr;
        titleEl.classList.remove("translating");
      })
      .catch(() => { if(titleEl) titleEl.classList.remove("translating"); });
  }

  if(it.desc && !getCachedTr(it.desc) && descEl){
    trEnqueue(() => gTranslate(it.desc.slice(0, 220), targetLang))
      .then(tr => { if(tr && descEl) descEl.textContent = tr.slice(0, 240) + (tr.length > 240 ? "…" : ""); })
      .catch(() => {});
  }
}

/* ================= MAP ================= */
const CAT_COLORS = {
  war:{color:"#e63950",label:"Oorlog"}, gaza:{color:"#dc2626",label:"Gaza"},
  lebanon:{color:"#ea580c",label:"Libanon"}, syria:{color:"#d97706",label:"Syrië"},
  yemen:{color:"#ca8a04",label:"Jemen"}, iran:{color:"#84cc16",label:"Iran"},
  ukraine:{color:"#3b82f6",label:"Oekraïne"}, sudan:{color:"#0891b2",label:"Soedan"},
  maroc:{color:"#e0a458",label:"Marokko"}, mideast:{color:"#a855f7",label:"Midden-Oosten"},
  world:{color:"#64748b",label:"Wereld"}, nl:{color:"#fb923c",label:"Nederland"},
  sport:{color:"#22c55e",label:"Sport"}, business:{color:"#14b8a6",label:"Economie"},
  tech:{color:"#06b6d4",label:"Tech"}, health:{color:"#ec4899",label:"Gezondheid"},
  algemeen:{color:"#94a3b8",label:"Algemeen"}
};

function initMap(){
  if(map) return;
  map = L.map("map", { center:[30,38], zoom:3, worldCopyJump:true, zoomControl:true });
  const isLight = document.body.classList.contains("light");
  const tileUrl = isLight
    ? "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}"
    : "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}";
  L.tileLayer(tileUrl, { maxZoom:16, attribution:'© Esri · © OpenStreetMap' }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

function renderMap(){
  if(!map) initMap();
  if(!map) return;
  markersLayer.clearLayers();

  const list = getFilteredBase();
  const byLoc = {};
  list.forEach(it => {
    const key = it.lat.toFixed(2) + "," + it.lon.toFixed(2);
    if(!byLoc[key]) byLoc[key] = { items: [], cats: {} };
    byLoc[key].items.push(it);
    byLoc[key].cats[it.cat] = (byLoc[key].cats[it.cat] || 0) + 1;
  });

  const catCounts = {};
  list.forEach(it => { catCounts[it.cat] = (catCounts[it.cat] || 0) + 1; });

  const legendItems = document.getElementById("legendItems");
  if(legendItems){
    const sorted = Object.entries(catCounts).sort((a, b) => b[1] - a[1]);
    legendItems.innerHTML = sorted.slice(0, 10).map(([cat, count]) => {
      const c = CAT_COLORS[cat] || CAT_COLORS.algemeen;
      return `<div class="item"><span class="dot" style="background:${c.color}; color:${c.color}"></span><span>${c.label}</span><span class="num">${count}</span></div>`;
    }).join("");
  }

  Object.entries(byLoc).forEach(([key, data]) => {
    const [lat, lon] = key.split(",").map(Number);
    const items = data.items;
    let dominant = "algemeen", maxCount = 0;
    for(const [cat, count] of Object.entries(data.cats)){
      if(count > maxCount){ maxCount = count; dominant = cat; }
    }
    const color = (CAT_COLORS[dominant] || CAT_COLORS.algemeen).color;
    const count = items.length;
    const size = Math.min(24 + (count * 2), 44);

    const icon = L.divIcon({
      className: "custom-marker",
      html: `<div class="marker-pulse" style="color:${color}; width:${size}px; height:${size}px;">
        <span class="ring"></span><span class="ring delay"></span>
        <span class="core" style="background:${color}"></span>
        ${count > 1 ? `<span class="count" style="background:${color}">${count}</span>` : ''}
      </div>`,
      iconSize: [size, size], iconAnchor: [size/2, size/2]
    });

    const marker = L.marker([lat, lon], { icon }).addTo(markersLayer);
    const top = items.slice(0, 5);
    const html = `
      <div>
        <div class="pop-src">${count} artikel${count>1?'en':''} · ${(CAT_COLORS[dominant]||CAT_COLORS.algemeen).label}</div>
        ${top.map(it => {
          const cached = getCachedTr(it.title);
          const arabic = isArabic(it.title);
          let displayTitle;
          if(cached && !isArabic(cached)) displayTitle = escapeHtml(cached.slice(0, 90));
          else if(arabic) displayTitle = "📄 " + escapeHtml(it.source) + " — klik om te lezen";
          else displayTitle = escapeHtml(it.title.slice(0, 90));
          return `<div style="margin-bottom:.6rem">
            <h4 style="font-family:'Playfair Display',serif; font-size:.85rem; line-height:1.3; margin:.3rem 0 .35rem; font-weight:600; color:var(--ink);">${displayTitle}${displayTitle.length>90?'…':''}</h4>
            <div style="font-size:.6rem; color:var(--ink-3); letter-spacing:.05em; font-weight:600; margin-bottom:.3rem;">${escapeHtml(it.source)} · ${timeAgo(it.date)}</div>
            <a href="${escapeHtml(it.link)}" target="_blank" rel="noopener">Lees verder →</a>
          </div>`;
        }).join("")}
        ${items.length > 5 ? `<div style="font-size:.65rem; color:var(--ink-3); text-align:center; padding-top:.5rem; border-top:1px solid var(--line);">+ ${items.length - 5} meer artikelen</div>` : ''}
      </div>`;
    marker.bindPopup(html);
  });
}

/* ================= LIVE TV ================= */
function loadLiveChannel(key){
  const ch = LIVE_CHANNELS[key];
  if(!ch) return;
  currentLiveChannel = key;
  document.getElementById("liveChannelName").textContent = ch.label;
  document.getElementById("liveChannelDesc").textContent = ch.desc;
  document.getElementById("liveIcon").textContent = ch.icon;
  document.getElementById("liveYoutube").href = ch.youtube;
  document.getElementById("liveTiktok").href = ch.tiktok;
  document.getElementById("liveWeb").href = ch.web;
  try { localStorage.setItem("wardesk_live", key); } catch(e){}
}

document.querySelectorAll(".live-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".live-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    loadLiveChannel(chip.dataset.live);
  });
});

/* ================= VIEWS ================= */
function showOnly(view){
  listView.style.display = "none";
  liveView.style.display = "none";
  mapView.classList.remove("active");
  if(view === "list") listView.style.display = "block";
  else if(view === "live"){ liveView.style.display = "block"; loadLiveChannel(currentLiveChannel); }
  else if(view === "map"){
    mapView.classList.add("active");
    setTimeout(() => {
      if(!map) initMap();
      if(map){ map.invalidateSize(); renderMap(); }
    }, 100);
  }
}

function switchView(v){
  currentView = v;
  viewListBtn.classList.toggle("active", v === "list");
  viewMapBtn.classList.toggle("active", v === "map");
  showOnly(v);
  try { localStorage.setItem("wardesk_view", v); } catch(e){}
}

/* ================= TABS ================= */
navTabs.addEventListener("click", e => {
  const tab = e.target.closest(".nav-tab");
  if(!tab) return;
  navTabs.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  activeCat = tab.dataset.cat;
  currentPage = 1;
  if(activeCat === "live"){
    showOnly("live");
    viewListBtn.classList.remove("active");
    viewMapBtn.classList.remove("active");
    return;
  }
  showOnly("list");
  viewListBtn.classList.add("active");
  viewMapBtn.classList.remove("active");
  render(); renderHero();
});

searchInput.addEventListener("input", () => {

  searchWrap.classList.toggle("has-value", val.length > 0);

searchClear.addEventListener("click", () => {

failedToggle.addEventListener("click", () => failedList.classList.toggle("show"));

/* ================= NOTIFICATIONS ================= */
function updateNotifBtn(){
  if(!("Notification" in window)){ notifBtn.style.display = "none"; return; }
  notifBtn.classList.toggle("on", notifEnabled && Notification.permission === "granted");
  notifBtn.textContent = (notifEnabled && Notification.permission === "granted") ? "🔔" : "🔕";
}
updateNotifBtn();
notifBtn.addEventListener("click", async () => {
  if(!("Notification" in window)){ showToast("Notificaties niet ondersteund", "⚠"); return; }
  if(notifEnabled && Notification.permission === "granted"){
    notifEnabled = false;
    localStorage.setItem(NOTIF_KEY, "0");
    showToast("Notificaties uit", "🔕"); updateNotifBtn();
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm === "granted"){
    notifEnabled = true;
    localStorage.setItem(NOTIF_KEY, "1");
    showToast("Notificaties aan", "🔔");
    try { new Notification("WAR DESK", { body: "Je krijgt nu meldingen bij breaking news." }); } catch(e){}
  } else showToast("Notificaties geweigerd", "⚠");
  updateNotifBtn();
});

/* ================= BUTTONS ================= */
refreshBtn.addEventListener("click", () => loadFeeds(false));
viewListBtn.addEventListener("click", () => {
  if(activeCat === "live"){
    navTabs.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));

});

  document.body.classList.toggle("light");
  localStorage.setItem("wardesk_theme", document.body.classList.contains("light") ? "light" : "dark");
  updateThemeMeta();
  if(map){
    map.remove(); map = null; markersLayer = null;
    initMap();
    setTimeout(() => { if(map){ map.invalidateSize(); renderMap(); } }, 200);
  }
});

backTop.addEventListener("click", () => window.scrollTo({ top:0, behavior:"smooth" }));

/* ================= KEYBOARD SHORTCUTS ================= */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if(k === "/"){ e.preventDefault(); searchInput.focus(); searchInput.select(); }
  else if(k === "r"){ e.preventDefault(); loadFeeds(false); }
  else if(k === "m"){ e.preventDefault(); switchView(currentView === "map" ? "list" : "map"); }
  else if(k === "l"){ e.preventDefault(); switchView("list"); }
  else if(k === "f"){
    e.preventDefault();
    navTabs.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
    const favTab = navTabs.querySelector('[data-cat="fav"]');
    if(favTab) favTab.classList.add("active");
    activeCat = "fav"; currentPage = 1;
    switchView("list"); render(); renderHero();
  }
  else if(k === "escape"){ srcPopup.classList.remove("show"); breakingBanner.classList.remove("show"); searchInput.blur(); }
});

/* ================= RESIZE ================= */
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => renderHero(), 300);
});

/* ================= CLOCK + AUTO REFRESH ================= */
setInterval(() => {
  const now = new Date();
  clockEl.textContent = now.toLocaleTimeString("nl-NL", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  nextRefreshSeconds--;
  if(nextRefreshSeconds < 0) nextRefreshSeconds = REFRESH_MS/1000;
  nextEl.textContent = nextRefreshSeconds + "s";
}, 1000);

setInterval(() => {
  const idleTime = Date.now() - lastUserActivity;
  const atTop = window.scrollY < 200;
  if(idleTime < INACTIVITY_MS && !atTop){
    if(!refreshPaused){ refreshPaused = true; pausedIndicator.classList.add("show"); }
    return;
  }
  if(isUserScrolling) return;
  if(refreshPaused){ refreshPaused = false; pausedIndicator.classList.remove("show"); }
  loadFeeds(true);
}, REFRESH_MS);

/* Pauzeer refresh bij verborgen tab */
document.addEventListener("visibilitychange", () => {
  if(document.hidden){
    refreshPaused = true;
    pausedIndicator.classList.add("show");
  } else {
    markActivity();
  }
});

/* ================= INIT ================= */
const savedView = (() => { try { return localStorage.getItem("wardesk_view"); } catch(e){ return null; } })() || "list";
const savedLive = (() => { try { return localStorage.getItem("wardesk_live"); } catch(e){ return null; } })() || "aljazeera-en";
currentLiveChannel = savedLive;
document.querySelectorAll(".live-chip").forEach(c => c.classList.toggle("active", c.dataset.live === savedLive));

switchView(savedView);
loadFeeds(false);

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(err => console.log("SW:", err));
  });
}
