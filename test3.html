<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAR DESK — War-Tracker velden</title>
<style>
body{font-family:monospace;background:#070c16;color:#f5f8ff;padding:1rem;font-size:12px;line-height:1.5}
h1{font-size:1.1rem;color:#e2a857;margin-bottom:.5rem;font-family:sans-serif}
.info{background:rgba(226,168,87,.1);border-left:3px solid #e2a857;padding:.7rem;border-radius:6px;margin-bottom:1rem;font-family:sans-serif;font-size:.85rem}
pre{background:#0d1522;padding:.8rem;border-radius:8px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;border:1px solid #1a2540;margin-bottom:1rem}
.key{color:#10b981}
.val{color:#f0c78a}
.label{color:#5eead4;font-weight:bold;margin-top:.8rem;display:block;font-family:sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>

<h1>War-Tracker — veld-inspectie</h1>
<div class="info">Deze pagina toont de ruwe data van de War-Tracker API. Hieruit kunnen we afleiden welke velden we nodig hebben voor de kaart.</div>

<div id="output">Laden...</div>

<script>
var WORKER = "https://newsfeed2.hassanbadri814.workers.dev/?url=";
var API = "https://war-tracker.com/api/v1/events?limit=5";

fetch(WORKER + encodeURIComponent(API))
  .then(function(r){ return r.text(); })
  .then(function(text){
    var data;
    try { data = JSON.parse(text); } catch(e){ document.getElementById("output").innerHTML = "<pre>JSON fout: " + text.slice(0,500) + "</pre>"; return; }

    var events = data.events || data;
    var out = document.getElementById("output");
    var html = "";

    html += '<span class="label">Aantal events</span><pre>' + events.length + '</pre>';

    // Toon eerste event volledig
    if(events.length > 0){
      html += '<span class="label">Volledige eerste event (ruwe JSON)</span>';
      html += '<pre>' + JSON.stringify(events[0], null, 2) + '</pre>';

      html += '<span class="label">Beschikbare velden in eerste event</span><pre>';
      Object.keys(events[0]).forEach(function(k){
        html += '<span class="key">' + k + '</span>: ' + typeof events[0][k] + '  →  <span class="val">' + String(events[0][k]).slice(0,100) + '</span>\n';
      });
      html += '</pre>';

      // Kijk of lat/lon bestaat
      var e = events[0];
      var latFields = Object.keys(e).filter(function(k){ return /lat/i.test(k); });
      var lonFields = Object.keys(e).filter(function(k){ return /lon|lng/i.test(k); });

      html += '<span class="label">Gevonden latitude velden</span><pre>' + (latFields.length ? latFields.join(", ") : "(geen)") + '</pre>';
      html += '<span class="label">Gevonden longitude velden</span><pre>' + (lonFields.length ? lonFields.join(", ") : "(geen)") + '</pre>';
    }

    out.innerHTML = html;
  })
  .catch(function(e){
    document.getElementById("output").innerHTML = "<pre>Fout: " + e.message + "</pre>";
  });
</script>

</body>
</html>
