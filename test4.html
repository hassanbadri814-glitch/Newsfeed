<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAR DESK — War-Tracker volledig</title>
<style>
body{font-family:monospace;background:#070c16;color:#f5f8ff;padding:1rem;font-size:12px;line-height:1.5}
h1{font-size:1.1rem;color:#e2a857;margin-bottom:.5rem;font-family:sans-serif}
.summary{background:linear-gradient(135deg,rgba(226,168,87,.1),transparent);border:1px solid rgba(226,168,87,.4);border-radius:10px;padding:1rem;margin-bottom:1rem;font-family:sans-serif}
.summary-row{display:flex;justify-content:space-between;padding:.2rem 0;font-size:.9rem}
.summary-row span:first-child{color:#a9b7ce}
.summary-row span:last-child{font-weight:bold}
.event{background:#0d1522;border:1px solid #1a2540;border-radius:8px;padding:.8rem;margin-bottom:.6rem;font-size:11px}
.event.has-loc{border-left:3px solid #10b981}
.event.no-loc{border-left:3px solid #6b7a93;opacity:.6}
.loc-row{display:flex;gap:1rem;flex-wrap:wrap;margin:.3rem 0;font-size:.75rem}
.loc-item{background:#131e30;padding:.2rem .5rem;border-radius:4px;color:#5eead4}
.desc{color:#f0c78a;font-size:.8rem;margin-top:.3rem}
</style>
</head>
<body>

<h1>War-Tracker — volledige inspectie</h1>

<div id="output">Laden...</div>

<script>
var WORKER = "https://newsfeed2.hassanbadri814.workers.dev/?url=";
var API = "https://war-tracker.com/api/v1/events?limit=30";

fetch(WORKER + encodeURIComponent(API))
  .then(function(r){ return r.text(); })
  .then(function(text){
    var data;
    try { data = JSON.parse(text); } catch(e){ document.getElementById("output").innerHTML = "<pre>JSON fout: " + text.slice(0,300) + "</pre>"; return; }

    var events = data.events || data;
    var withLoc = events.filter(function(e){ return e.lat !== null && e.lng !== null; });
    var withLocNum = events.filter(function(e){ return typeof e.lat === "number" && typeof e.lng === "number"; });
    var confidenceCount = {};
    events.forEach(function(e){
      var c = e.confidence || "onbekend";
      confidenceCount[c] = (confidenceCount[c] || 0) + 1;
    });

    var html = "";
    html += '<div class="summary">';
    html += '<div class="summary-row"><span>Totaal events</span><span>' + events.length + '</span></div>';
    html += '<div class="summary-row"><span>Met lat/lng (niet null)</span><span>' + withLoc.length + '</span></div>';
    html += '<div class="summary-row"><span>Met lat/lng (nummer)</span><span>' + withLocNum.length + '</span></div>';
    html += '<div class="summary-row"><span>Confidence niveaus</span><span>' + JSON.stringify(confidenceCount) + '</span></div>';
    html += '</div>';

    html += '<h2 style="color:#e2a857;font-family:sans-serif;font-size:.9rem;margin:.8rem 0 .5rem">Events met locatie:</h2>';
    if(withLocNum.length === 0){
      html += '<div style="color:#e63950;padding:.5rem">Geen enkel event heeft coördinaten in de eerste ' + events.length + ' events.</div>';
    }
    withLocNum.forEach(function(e){
      html += '<div class="event has-loc">';
      html += '<div><b>#' + e.id + '</b> — ' + e.event_type + '</div>';
      html += '<div class="loc-row">';
      html += '<span class="loc-item">lat: ' + e.lat + '</span>';
      html += '<span class="loc-item">lng: ' + e.lng + '</span>';
      html += '<span class="loc-item">country: ' + (e.country_name || e.country || "?") + '</span>';
      html += '</div>';
      html += '<div class="desc">' + (e.description || "").slice(0,150) + '</div>';
      html += '</div>';
    });

    html += '<h2 style="color:#e2a857;font-family:sans-serif;font-size:.9rem;margin:1rem 0 .5rem">Events zonder locatie (eerste 5):</h2>';
    events.filter(function(e){ return !(typeof e.lat === "number"); }).slice(0,5).forEach(function(e){
      html += '<div class="event no-loc">';
      html += '<div><b>#' + e.id + '</b> — ' + e.event_type + ' (' + e.confidence + ')</div>';
      html += '<div class="desc">' + (e.description || "").slice(0,150) + '</div>';
      html += '</div>';
    });

    document.getElementById("output").innerHTML = html;
  })
  .catch(function(e){
    document.getElementById("output").innerHTML = "<pre>Fout: " + e.message + "</pre>";
  });
</script>

</body>
</html>
