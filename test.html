<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAR DESK — Bronnen Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#070c16;color:#f5f8ff;padding:1rem;line-height:1.5;font-size:15px}
h1{font-size:1.3rem;margin-bottom:.3rem;color:#e2a857}
h2{font-size:.9rem;margin:1.5rem 0 .8rem;color:#e2a857;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid #1a2540;padding-bottom:.4rem}
h3{font-size:.85rem;margin-bottom:.4rem}
.sub{color:#6b7a93;font-size:.75rem;margin-bottom:1rem}
.test{background:#111b2d;border:1px solid #1a2540;border-radius:10px;padding:.85rem;margin-bottom:.6rem;transition:all .3s}
.test.pending{border-left:3px solid #e2a857}
.test.ok{border-left:3px solid #10b981;background:rgba(16,185,129,.05)}
.test.fail{border-left:3px solid #e63950;background:rgba(230,57,80,.05)}
.test.warn{border-left:3px solid #f59e0b;background:rgba(245,158,11,.05)}
.test-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.test-icon{font-size:1.1rem}
.test-name{font-weight:700;flex:1;font-size:.85rem}
.test-status{font-size:.65rem;font-weight:700;text-transform:uppercase;padding:.15rem .5rem;border-radius:5px}
.pending .test-status{background:rgba(226,168,87,.2);color:#e2a857}
.ok .test-status{background:rgba(16,185,129,.2);color:#10b981}
.fail .test-status{background:rgba(230,57,80,.2);color:#e63950}
.warn .test-status{background:rgba(245,158,11,.2);color:#f59e0b}
.test-info{font-size:.72rem;color:#a9b7ce;line-height:1.5;word-break:break-word}
.test-info a{color:#e2a857}
.map-mini{width:100%;height:180px;border-radius:8px;margin-top:.6rem;background:#0d1522;border:1px solid #26344f}
pre{background:#0d1522;padding:.5rem;border-radius:6px;font-size:.65rem;overflow-x:auto;margin-top:.4rem;color:#a9b7ce;max-height:150px;overflow-y:auto;border:1px solid #1a2540}
.summary{background:linear-gradient(135deg,rgba(226,168,87,.1),rgba(226,168,87,.03));border:1px solid rgba(226,168,87,.4);border-radius:12px;padding:1rem;margin-bottom:1rem}
.summary-row{display:flex;justify-content:space-between;font-size:.8rem;padding:.25rem 0}
.summary-row span:first-child{color:#a9b7ce}
.summary-row span:last-child{font-weight:700}
.summary-row.ok span:last-child{color:#10b981}
.summary-row.fail span:last-child{color:#e63950}
</style>
</head>
<body>

<h1>WAR DESK — Bronnen Test</h1>
<div class="sub">Geen implementatie. Alleen testen wat werkt op jouw netwerk.</div>

<div class="summary" id="summary">
  <div class="summary-row"><span>Kaart-tiles:</span><span id="sumTiles">laden...</span></div>
  <div class="summary-row"><span>Event-API's:</span><span id="sumEvents">laden...</span></div>
  <div class="summary-row"><span>Klaar:</span><span id="sumStatus">bezig</span></div>
</div>

<h2>1. Kaart-tiles (Leaflet raster)</h2>
<div id="tilesWrap"></div>

<h2>2. Event API's</h2>
<div id="eventsWrap"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script>
/* ============================================================
   WAR DESK — Bronnen Test v1
   ============================================================ */

var TILES = [
  {
    id: "osm-standard",
    name: "OpenStreetMap Standaard",
    desc: "Officiële OSM tiles — gratis, geen key",
    url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    attribution: "© OpenStreetMap"
  },
  {
    id: "osm-de",
    name: "OpenStreetMap (DE mirror)",
    desc: "Duitse mirror — alternatief",
    url: "https://tile.openstreetmap.de/{z}/{x}/{y}.png",
    attribution: "© OpenStreetMap"
  },
  {
    id: "osm-fr",
    name: "OpenStreetMap (FR mirror)",
    desc: "Franse mirror — alternatief",
    url: "https://a.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",
    attribution: "© OpenStreetMap France"
  },
  {
    id: "opentopo",
    name: "OpenTopoMap",
    desc: "Topografische kaart",
    url: "https://a.tile.opentopomap.org/{z}/{x}/{y}.png",
    attribution: "© OpenTopoMap"
  },
  {
    id: "esri-imagery",
    name: "Esri World Imagery",
    desc: "Satellietbeelden",
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    attribution: "© Esri"
  },
  {
    id: "esri-street",
    name: "Esri World Street Map",
    desc: "Esri stratenkaart",
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    attribution: "© Esri"
  },
  {
    id: "carto-dark",
    name: "CartoDB Dark Matter",
    desc: "Voormalig gratis — nu misschien key vereist",
    url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png",
    attribution: "© CartoDB",
    subdomains: "abcd"
  },
  {
    id: "carto-voyager",
    name: "CartoDB Voyager",
    desc: "Heldere CartoDB stijl",
    url: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
    attribution: "© CartoDB",
    subdomains: "abcd"
  },
  {
    id: "wikimedia",
    name: "Wikimedia Maps",
    desc: "Wikimedia Foundation OSM",
    url: "https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png",
    attribution: "© Wikimedia"
  }
];

var APIS = [
  {
    id: "war-tracker",
    name: "War-Tracker API",
    desc: "Real-time conflict events (OSINT)",
    url: "https://war-tracker.com/api/v1/events?limit=5",
    type: "json",
    validate: function(d){ return Array.isArray(d) && d.length > 0; },
    sample: function(d){
      return d.slice(0,2).map(function(e){
        return "• " + (e.title || e.summary || "?").slice(0,80) + " — " + (e.country || "?");
      }).join("\n");
    }
  },
  {
    id: "gdelt-geo",
    name: "GDELT GeoJSON",
    desc: "Global events database (15-min updates)",
    url: "https://api.gdeltproject.org/api/v2/geo/geo?query=conflict&mode=PointData&format=GeoJSON&maxrecords=5&timespan=1440",
    type: "json",
    validate: function(d){ return d && d.features && d.features.length > 0; },
    sample: function(d){
      return "Features: " + d.features.length + "\n" +
        d.features.slice(0,2).map(function(f){
          var p = f.properties || {};
          return "• " + (p.name || "?").slice(0,80);
        }).join("\n");
    }
  },
  {
    id: "gdelt-doc",
    name: "GDELT DOC API",
    desc: "Nieuws-artikelen (JSON)",
    url: "https://api.gdeltproject.org/api/v2/doc/doc?query=conflict&mode=artlist&maxrecords=5&format=json",
    type: "json",
    validate: function(d){ return d && d.articles && d.articles.length > 0; },
    sample: function(d){
      return "Artikelen: " + d.articles.length + "\n" +
        d.articles.slice(0,2).map(function(a){
          return "• " + (a.title || "?").slice(0,80);
        }).join("\n");
    }
  },
  {
    id: "reliefweb",
    name: "ReliefWeb API (VN OCHA)",
    desc: "VN-humanitaire rapporten",
    url: "https://api.reliefweb.int/v1/reports?appname=wardesk-test&limit=5&profile=full",
    type: "json",
    validate: function(d){ return d && d.data && d.data.length > 0; },
    sample: function(d){
      return "Reports: " + d.data.length + "\n" +
        d.data.slice(0,2).map(function(r){
          return "• " + ((r.fields && r.fields.title) || "?").slice(0,80);
        }).join("\n");
    }
  },
  {
    id: "ucdp",
    name: "UCDP (Uppsala)",
    desc: "Conflict data — academisch",
    url: "https://ucdpapi.pcr.uu.se/api/gedevents/24.1?pagesize=5",
    type: "json",
    validate: function(d){ return d && d.Result && d.Result.length > 0; },
    sample: function(d){
      return "Events: " + d.Result.length + "\n" +
        d.Result.slice(0,2).map(function(e){
          return "• " + (e.side_a || "?") + " vs " + (e.side_b || "?");
        }).join("\n");
    }
  },
  {
    id: "acled",
    name: "ACLED (zonder key)",
    desc: "Verwacht: 401/403 — vereist account",
    url: "https://api.acleddata.com/acled/read?limit=5",
    type: "json",
    validate: function(d){ return d && d.data && d.data.length > 0; },
    sample: function(d){ return "Events: " + (d.data ? d.data.length : 0); }
  },
  {
    id: "liveuamap-rss",
    name: "Liveuamap RSS",
    desc: "Verwacht: geblokkeerd (403)",
    url: "https://liveuamap.com/rss",
    type: "text",
    validate: function(t){ return t && t.indexOf("<rss") >= 0; },
    sample: function(t){ return "RSS-lengte: " + t.length + " bytes"; }
  }
];

/* ===== STATE ===== */
var results = { tiles: {}, events: {} };

/* ===== TILE TESTS ===== */
function renderTileTests(){
  var wrap = document.getElementById("tilesWrap");
  TILES.forEach(function(t){
    var el = document.createElement("div");
    el.className = "test pending";
    el.id = "tile-" + t.id;
    el.innerHTML =
      '<div class="test-head">' +
        '<span class="test-icon">⏳</span>' +
        '<span class="test-name">' + t.name + '</span>' +
        '<span class="test-status">laden</span>' +
      '</div>' +
      '<div class="test-info">' + t.desc + '</div>' +
      '<div class="map-mini" id="map-' + t.id + '"></div>';
    wrap.appendChild(el);
  });
}

function testTile(t){
  return new Promise(function(resolve){
    var el = document.getElementById("tile-" + t.id);
    var mapEl = document.getElementById("map-" + t.id);
    if(!mapEl) return resolve(false);

    var map = L.map(mapEl, {
      center: [33, 30],
      zoom: 3,
      zoomControl: false,
      attributionControl: false
    });

    var loaded = false;
    var errored = false;

    var opts = { attribution: t.attribution, maxZoom: 18 };
    if(t.subdomains) opts.subdomains = t.subdomains;

    var layer = L.tileLayer(t.url, opts);

    layer.on("tileload", function(){
      if(!loaded && !errored){
        loaded = true;
        el.classList.remove("pending");
        el.classList.add("ok");
        el.querySelector(".test-icon").textContent = "✅";
        el.querySelector(".test-status").textContent = "werkt";
        results.tiles[t.id] = "ok";
        resolve(true);
      }
    });

    layer.on("tileerror", function(){
      if(!loaded && !errored){
        errored = true;
        setTimeout(function(){
          if(!loaded){
            el.classList.remove("pending");
            el.classList.add("fail");
            el.querySelector(".test-icon").textContent = "❌";
            el.querySelector(".test-status").textContent = "faalt";
            el.querySelector(".test-info").innerHTML = t.desc + '<br><span style="color:#e63950">Tiles laden niet (mogelijk key vereist of geblokkeerd)</span>';
            results.tiles[t.id] = "fail";
            resolve(false);
          }
        }, 500);
      }
    });

    layer.addTo(map);

    // Timeout: als na 8 sec niks is geladen → fail
    setTimeout(function(){
      if(!loaded && !errored){
        errored = true;
        el.classList.remove("pending");
        el.classList.add("warn");
        el.querySelector(".test-icon").textContent = "⚠️";
        el.querySelector(".test-status").textContent = "timeout";
        results.tiles[t.id] = "timeout";
        resolve(false);
      }
    }, 8000);
  });
}

/* ===== EVENT API TESTS ===== */
function renderEventTests(){
  var wrap = document.getElementById("eventsWrap");
  APIS.forEach(function(a){
    var el = document.createElement("div");
    el.className = "test pending";
    el.id = "api-" + a.id;
    el.innerHTML =
      '<div class="test-head">' +
        '<span class="test-icon">⏳</span>' +
        '<span class="test-name">' + a.name + '</span>' +
        '<span class="test-status">testen</span>' +
      '</div>' +
      '<div class="test-info">' + a.desc + '</div>';
    wrap.appendChild(el);
  });
}

function testApi(a){
  return new Promise(function(resolve){
    var el = document.getElementById("api-" + a.id);
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 15000);

    fetch(a.url, {signal: ctrl.signal})
      .then(function(r){
        clearTimeout(timer);
        return r.text().then(function(text){
          return {status: r.status, ok: r.ok, text: text};
        });
      })
      .then(function(res){
        var data = null;
        if(a.type === "json"){
          try{ data = JSON.parse(res.text); }catch(e){}
        } else {
          data = res.text;
        }

        var ok = res.ok;
        var valid = false;
        var sampleText = "";

        if(ok && data){
          try{
            valid = a.validate(data);
            if(valid) sampleText = a.sample(data);
          }catch(e){}
        }

        if(valid){
          el.classList.remove("pending");
          el.classList.add("ok");
          el.querySelector(".test-icon").textContent = "✅";
          el.querySelector(".test-status").textContent = "werkt";
          el.querySelector(".test-info").innerHTML = a.desc + '<pre>' + sampleText + '</pre>';
          results.events[a.id] = "ok";
          resolve(true);
        } else {
          var isWarn = (res.status === 401 || res.status === 403 || res.status === 429);
          el.classList.remove("pending");
          el.classList.add(isWarn ? "warn" : "fail");
          el.querySelector(".test-icon").textContent = isWarn ? "⚠️" : "❌";
          el.querySelector(".test-status").textContent = isWarn ? "geblokkeerd" : "faalt";
          el.querySelector(".test-info").innerHTML = a.desc +
            '<br><span style="color:' + (isWarn ? "#f59e0b" : "#e63950") + '">HTTP ' + res.status + '</span>' +
            '<pre>' + (res.text.slice(0,200) || "(leeg)") + '</pre>';
          results.events[a.id] = isWarn ? "blocked" : "fail";
          resolve(false);
        }
      })
      .catch(function(e){
        clearTimeout(timer);
        el.classList.remove("pending");
        el.classList.add("fail");
        el.querySelector(".test-icon").textContent = "❌";
        el.querySelector(".test-status").textContent = "fout";
        el.querySelector(".test-info").innerHTML = a.desc +
          '<br><span style="color:#e63950">' + (e.message || "fetch fout") + '</span>';
        results.events[a.id] = "error";
        resolve(false);
      });
  });
}

/* ===== SUMMARY ===== */
function updateSummary(){
  var tilesOk = Object.values(results.tiles).filter(function(v){return v==="ok";}).length;
  var tilesTotal = TILES.length;
  var eventsOk = Object.values(results.events).filter(function(v){return v==="ok";}).length;
  var eventsTotal = APIS.length;

  document.getElementById("sumTiles").textContent = tilesOk + " van " + tilesTotal;
  document.getElementById("sumEvents").textContent = eventsOk + " van " + eventsTotal;

  if(Object.keys(results.tiles).length === tilesTotal && Object.keys(results.events).length === eventsTotal){
    document.getElementById("sumStatus").textContent = "✅ Klaar";
  } else {
    document.getElementById("sumStatus").textContent = "⏳ Bezig...";
  }
}

/* ===== INIT ===== */
document.addEventListener("DOMContentLoaded", function(){
  renderTileTests();
  renderEventTests();

  setTimeout(function(){
    // Tiles parallel starten (leaflet blokkeert niet)
    TILES.forEach(function(t){ testTile(t).then(updateSummary); });

    // API's parallel
    APIS.forEach(function(a){ testApi(a).then(updateSummary); });
  }, 500);
});
</script>

</body>
</html>
