<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Wereld Nieuws · Live Map</title>

<!-- Leaflet (gratis kaart) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root{
    --bg:#0b1220; --card:#151e2e; --card2:#1c2740;
    --text:#e6edf7; --muted:#8ea3bf; --accent:#38bdf8;
    --accent2:#22c55e; --border:#243049; --danger:#f87171;
    --ar:#f59e0b;
  }
  body.light{
    --bg:#f4f7fb; --card:#ffffff; --card2:#eef3fa;
    --text:#0b1220; --muted:#5b6b82; --accent:#0284c7;
    --border:#dbe3ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
    background:var(--bg); color:var(--text);
    transition:background .25s,color .25s; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* Header */
  header{
    position:sticky; top:0; z-index:1000;
    background:rgba(11,18,32,.9);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    padding:.9rem 1.2rem;
  }
  body.light header{background:rgba(244,247,251,.92)}
  .topbar{
    max-width:1400px; margin:0 auto;
    display:flex; gap:1rem; align-items:center;
    justify-content:space-between; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:.6rem}
  .brand .dot{
    width:12px; height:12px; border-radius:50%;
    background:var(--accent2);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}
    70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}
    100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}
  }
  .brand h1{font-size:1.1rem; letter-spacing:-.3px; font-weight:700}
  .brand h1 span{color:var(--accent)}

  .filters{
    max-width:1400px; margin:.8rem auto 0;
    display:flex; gap:.6rem; flex-wrap:wrap; align-items:center;
  }
  .chips{display:flex; gap:.4rem; flex-wrap:wrap}
  .chip{
    padding:.42rem .85rem; border-radius:99px;
    border:1px solid var(--border); background:var(--card);
    color:var(--muted); cursor:pointer; font-size:.82rem;
    font-weight:600; transition:all .15s; user-select:none;
    white-space:nowrap;
  }
  .chip:hover{color:var(--text); border-color:var(--accent)}
  .chip.active{background:var(--accent); color:#00121f; border-color:var(--accent)}
  .chip.ar.active{background:var(--ar); color:#1a1200}

  .tools{display:flex; gap:.5rem; align-items:center; margin-left:auto; flex-wrap:wrap}
  input[type="search"]{
    font:inherit; padding:.5rem .9rem; border-radius:10px;
    border:1px solid var(--border); background:var(--card);
    color:var(--text); outline:none; min-width:160px;
  }
  input[type="search"]:focus{border-color:var(--accent)}
  .iconbtn{
    height:38px; min-width:38px; padding:0 .8rem; border-radius:10px;
    cursor:pointer; border:1px solid var(--border); background:var(--card);
    color:var(--text); font-size:.9rem; font-weight:600;
    display:inline-flex; align-items:center; gap:.4rem;
    justify-content:center; transition:all .15s;
  }
  .iconbtn:hover{border-color:var(--accent); color:var(--accent)}
  .iconbtn.active{background:var(--accent); color:#00121f; border-color:var(--accent)}
  .iconbtn.spinning span.icon{animation:spin 1s linear infinite; display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Status */
  #status{
    max-width:1400px; margin:0 auto;
    padding:.8rem 1.2rem; color:var(--muted); font-size:.85rem;
    display:flex; gap:.6rem; align-items:center; flex-wrap:wrap;
  }
  #status .live{
    display:inline-flex; align-items:center; gap:.35rem;
    color:var(--accent2); font-weight:700;
  }
  #status .live::before{
    content:""; width:7px; height:7px; border-radius:50%;
    background:var(--accent2);
    animation:pulse 2s infinite;
  }

  /* Views */
  .view{display:none}
  .view.active{display:block}

  /* Grid */
  .grid{
    display:grid; gap:1rem; padding:.4rem 1.2rem 3rem;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    max-width:1400px; margin:0 auto;
  }
  article{
    background:var(--card); border:1px solid var(--border);
    border-radius:16px; overflow:hidden; display:flex;
    flex-direction:column; transition:transform .2s,border-color .2s,box-shadow .2s;
  }
  article:hover{
    transform:translateY(-4px); border-color:var(--accent);
    box-shadow:0 12px 30px -12px rgba(56,189,248,.35);
  }
  article .thumb{
    position:relative; width:100%; aspect-ratio:16/9;
    background:linear-gradient(135deg,var(--card2),var(--bg)); overflow:hidden;
  }
  article .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  article .lang{
    position:absolute; top:.6rem; left:.6rem;
    background:rgba(0,0,0,.75); color:#fff;
    padding:.2rem .55rem; border-radius:6px;
    font-size:.7rem; font-weight:800; letter-spacing:.5px;
  }
  body.light article .lang{background:rgba(255,255,255,.9); color:#0b1220}
  article .lang.ar{background:var(--ar); color:#1a1200}

  article .body{padding:1rem; display:flex; flex-direction:column; gap:.5rem; flex:1}
  article .meta{
    display:flex; gap:.5rem; flex-wrap:wrap;
    font-size:.72rem; color:var(--muted);
    text-transform:uppercase; letter-spacing:.4px; align-items:center;
  }
  article .source{
    background:var(--card2); padding:.15rem .5rem;
    border-radius:6px; font-weight:700; color:var(--accent);
  }
  article h2{
    font-size:1rem; line-height:1.4; font-weight:700;
    display:-webkit-box; -webkit-line-clamp:3;
    -webkit-box-orient:vertical; overflow:hidden;
  }
  article[dir="rtl"] h2{
    font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
    line-height:1.6;
  }
  article p{
    font-size:.86rem; color:var(--muted); line-height:1.55;
    display:-webkit-box; -webkit-line-clamp:3;
    -webkit-box-orient:vertical; overflow:hidden; flex:1;
  }
  article[dir="rtl"] p{
    font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif; line-height:1.75;
  }
  article .read{
    color:var(--accent); text-decoration:none;
    font-weight:700; font-size:.85rem; margin-top:.3rem;
    display:inline-flex; align-items:center; gap:.3rem;
  }
  article[dir="rtl"] .read{justify-content:flex-end}

  /* Map view */
  #mapView{padding:0 1.2rem 2rem; max-width:1400px; margin:0 auto}
  #map{
    height:70vh; min-height:420px; border-radius:16px;
    border:1px solid var(--border); overflow:hidden;
    background:var(--card);
  }
  body.light #map{filter:none}
  body:not(.light) #map{
    /* donkere look voor de kaart in dark mode */
    filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9);
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip{
    background:var(--card); color:var(--text);
    border:1px solid var(--border);
  }
  .leaflet-popup-content{margin:.7rem .9rem; font-family:inherit; max-width:260px}
  .leaflet-popup-content h3{
    font-size:.9rem; line-height:1.35; margin-bottom:.4rem;
  }
  .leaflet-popup-content h3[dir="rtl"]{
    font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
    text-align:right; line-height:1.6;
  }
  .leaflet-popup-content .src{
    display:inline-block; background:var(--card2); color:var(--accent);
    padding:.1rem .45rem; border-radius:5px;
    font-size:.7rem; font-weight:700; margin-bottom:.4rem;
  }
  .leaflet-popup-content a{
    color:var(--accent); text-decoration:none;
    font-weight:700; font-size:.82rem; display:inline-block; margin-top:.3rem;
  }
  .leaflet-container{background:#0a101d}

  /* Marker pulse animatie */
  .pin-dot{
    width:16px; height:16px; border-radius:50%;
    background:var(--accent2); border:2px solid #fff;
    box-shadow:0 0 0 0 rgba(34,197,94,.8);
    animation:pinpulse 2s infinite;
  }
  .pin-dot.ar{background:var(--ar); box-shadow:0 0 0 0 rgba(245,158,11,.8)}
  @keyframes pinpulse{
    0%{box-shadow:0 0 0 0 rgba(34,197,94,.8)}
    70%{box-shadow:0 0 0 14px rgba(34,197,94,0)}
    100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}
  }

  /* Loader / empty */
  .loader{
    grid-column:1/-1; display:flex; flex-direction:column;
    align-items:center; gap:1rem; padding:4rem 1rem; color:var(--muted);
  }
  .loader .ring{
    width:44px; height:44px; border-radius:50%;
    border:3px solid var(--border); border-top-color:var(--accent);
    animation:spin .9s linear infinite;
  }
  .empty{grid-column:1/-1; text-align:center; padding:3rem 1rem; color:var(--muted)}
  .empty .big{font-size:2.5rem; margin-bottom:.6rem}
  .error{
    grid-column:1/-1; background:rgba(248,113,113,.08);
    border:1px solid rgba(248,113,113,.3); color:var(--danger);
    padding:1rem 1.2rem; border-radius:12px; font-size:.9rem;
  }

  footer{
    text-align:center; padding:2rem 1rem;
    color:var(--muted); font-size:.78rem;
    border-top:1px solid var(--border);
  }
  footer a{color:var(--accent); text-decoration:none}

  @media(max-width:640px){
    .brand h1{font-size:1rem}
    input[type="search"]{min-width:0; flex:1}
    .tools{width:100%}
    .grid{grid-template-columns:1fr; padding:.4rem .8rem 2rem}
    .filters{padding:0 .4rem}
    #mapView{padding:0 .8rem 1.5rem}
    #map{height:60vh}
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>Wereld <span>Nieuws</span> · Live</h1>
    </div>
    <div class="tools">
      <input id="search" type="search" placeholder="🔎 Zoeken..." aria-label="Zoeken">
      <button class="iconbtn" id="viewList" title="Lijstweergave">📰 Lijst</button>
      <button class="iconbtn" id="viewMap" title="Kaartweergave">🗺️ Kaart</button>
      <button class="iconbtn" id="refresh" title="Verversen"><span class="icon">↻</span></button>
      <button class="iconbtn" id="theme" title="Thema">🌓</button>
    </div>
  </div>

  <div class="filters">
    <div class="chips" id="cats">
      <div class="chip active" data-cat="all">🌍 Alles</div>
      <div class="chip" data-cat="top">🔥 Top</div>
      <div class="chip" data-cat="world">🌐 Wereld</div>
      <div class="chip" data-cat="mideast">🕌 Midden-Oosten</div>
      <div class="chip" data-cat="business">💼 Economie</div>
      <div class="chip" data-cat="tech">💻 Tech</div>
      <div class="chip" data-cat="sport">⚽ Sport</div>
    </div>
    <div class="chips" id="langs" style="margin-left:auto">
      <div class="chip active" data-lang="all">Alle talen</div>
      <div class="chip" data-lang="en">EN</div>
      <div class="chip ar" data-lang="ar">العربية</div>
    </div>
  </div>
</header>

<div id="status">
  <span class="live">LIVE</span>
  <span id="statusText">Feeds laden...</span>
</div>

<!-- Lijstweergave -->
<main class="view active" id="listView">
  <div class="grid" id="feed">
    <div class="loader">
      <div class="ring"></div>
      <div>Nieuws ophalen...</div>
    </div>
  </div>
</main>

<!-- Kaartweergave -->
<section class="view" id="mapView">
  <div id="map"></div>
</section>

<footer>
  Live wereldkaart · Bronnen: Al Jazeera · BBC · DW · France24 · RT · Sky News Arabia
</footer>

<script>
/* ==========================================================
   NIEUWSFEED — configuratie
   Elke feed heeft coördinaten voor de kaart (lat, lon).
   ========================================================== */
const FEEDS = [
  // Al Jazeera
  { name:"Al Jazeera",     lang:"en", cat:"top",     lat:25.2854, lon:51.5310, url:"https://www.aljazeera.com/xml/rss/all.xml" },
  { name:"Al Jazeera AR",  lang:"ar", cat:"mideast", lat:25.2854, lon:51.5310, url:"https://www.aljazeera.net/aljazeerarss/a7c186be-1baa-4bd4-9d80-a84db769f779/73d0e1b4-532f-45ef-b135-bfdff8b8cab9" },

  // BBC
  { name:"BBC World",      lang:"en", cat:"world",   lat:51.5074, lon:-0.1278, url:"https://feeds.bbci.co.uk/news/world/rss.xml" },
  { name:"BBC Tech",       lang:"en", cat:"tech",    lat:51.5074, lon:-0.1278, url:"https://feeds.bbci.co.uk/news/technology/rss.xml" },
  { name:"BBC Business",   lang:"en", cat:"business",lat:51.5074, lon:-0.1278, url:"https://feeds.bbci.co.uk/news/business/rss.xml" },
  { name:"BBC Sport",      lang:"en", cat:"sport",   lat:51.5074, lon:-0.1278, url:"https://feeds.bbci.co.uk/sport/rss.xml" },
  { name:"BBC Arabic",     lang:"ar", cat:"world",   lat:51.5074, lon:-0.1278, url:"https://feeds.bbci.co.uk/arabic/rss.xml" },

  // Andere zenders
  { name:"DW Arabic",      lang:"ar", cat:"world",   lat:52.5200, lon:13.4050, url:"https://rss.dw.com/rdf/rss-ar-all" },
  { name:"France24 AR",    lang:"ar", cat:"world",   lat:48.8566, lon:2.3522,  url:"https://www.france24.com/ar/rss" },
  { name:"RT Arabic",      lang:"ar", cat:"mideast", lat:55.7558, lon:37.6173, url:"https://arabic.rt.com/rss/" },
  { name:"Sky News Arabia",lang:"ar", cat:"mideast", lat:24.4539, lon:54.3773, url:"https://www.skynewsarabia.com/web/rss/95.xml" }
];

const PROXY = "https://api.rss2json.com/v1/api.json?rss_url=";
const REFRESH_MS = 5 * 60 * 1000;

/* ---------- State ---------- */
let allItems = [];
let activeCat = "all";
let activeLang = "all";
let currentView = "list"; // "list" | "map"
let map = null;
let markersLayer = null;

/* ---------- DOM ---------- */
const feedEl    = document.getElementById("feed");
const statusEl  = document.getElementById("statusText");
const searchEl  = document.getElementById("search");
const catsEl    = document.getElementById("cats");
const langsEl   = document.getElementById("langs");
const refreshEl = document.getElementById("refresh");
const listView  = document.getElementById("listView");
const mapView   = document.getElementById("mapView");
const viewListBtn = document.getElementById("viewList");
const viewMapBtn  = document.getElementById("viewMap");

/* ---------- Helpers ---------- */
function stripHtml(s){
  return (s||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function timeAgo(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return "";
  const diff = (Date.now() - d.getTime()) / 1000;
  if(diff < 60) return "net nu";
  if(diff < 3600) return Math.floor(diff/60) + " min";
  if(diff < 86400) return Math.floor(diff/3600) + " u";
  if(diff < 604800) return Math.floor(diff/86400) + " d";
  return d.toLocaleDateString("nl-NL", { day:"numeric", month:"short" });
}
function isProbablyArabic(t){ return /[\u0600-\u06FF]/.test(t||""); }

/* ---------- Feeds laden ---------- */
async function loadFeeds(){
  statusEl.textContent = "Feeds laden...";
  refreshEl.classList.add("spinning");

  feedEl.innerHTML = `
    <div class="loader">
      <div class="ring"></div>
      <div>Nieuws ophalen van ${FEEDS.length} bronnen...</div>
    </div>`;

  const results = await Promise.allSettled(
    FEEDS.map(f =>
      fetch(PROXY + encodeURIComponent(f.url))
        .then(r => r.json())
        .then(data => {
          if(!data || data.status !== "ok" || !Array.isArray(data.items))
            throw new Error("feed fail");
          return data.items.map(it => ({
            title: it.title || "",
            link:  it.link  || "#",
            desc:  it.description || it.content || "",
            img:   it.thumbnail ||
                   it.enclosure?.link ||
                   (it.content||"").match(/<img[^>]+src="([^"]+)"/i)?.[1] ||
                   "",
            date:  it.pubDate || "",
            source: f.name,
            cat:   f.cat,
            lang:  f.lang,
            lat:   f.lat,
            lon:   f.lon
          }));
        })
    )
  );

  allItems = [];
  let okCount = 0;
  results.forEach(r => {
    if(r.status === "fulfilled"){ allItems.push(...r.value); okCount++; }
  });

  allItems.sort((a,b) => new Date(b.date) - new Date(a.date));
  refreshEl.classList.remove("spinning");

  if(!allItems.length){
    feedEl.innerHTML = `<div class="error">⚠️ Kon geen artikelen laden. Controleer je internet.</div>`;
    statusEl.textContent = "0 artikelen";
    return;
  }

  statusEl.textContent =
    `${allItems.length} artikelen · ${okCount}/${FEEDS.length} bronnen · ${new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})}`;

  render();
  renderMap();
}

/* ---------- Filter ---------- */
function getFiltered(){
  const q = searchEl.value.toLowerCase().trim();
  return allItems.filter(it => {
    if(activeCat !== "all" && it.cat !== activeCat) return false;
    if(activeLang !== "all" && it.lang !== activeLang) return false;
    if(q){
      const hay = (it.title + " " + stripHtml(it.desc)).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ---------- Lijst renderen ---------- */
function render(){
  const list = getFiltered();

  if(!list.length){
    feedEl.innerHTML = `<div class="empty"><div class="big">🔍</div><div>Geen artikelen gevonden.</div></div>`;
    return;
  }

  feedEl.innerHTML = list.map(it => {
    const rtl = it.lang === "ar" || isProbablyArabic(it.title);
    const desc = stripHtml(it.desc).slice(0,180);
    const img = it.img
      ? `<img src="${escapeHtml(it.img)}" alt="" loading="lazy"
              onerror="this.parentElement.style.display='none'">` : "";
    const catLabel = {
      top:"TOP", world:"WERELD", mideast:"MIDDEN-OOSTEN",
      business:"ECONOMIE", tech:"TECH", sport:"SPORT"
    }[it.cat] || it.cat;

    return `
      <article dir="${rtl?'rtl':'ltr'}">
        <div class="thumb">${img}<span class="lang ${it.lang==='ar'?'ar':''}">${it.lang.toUpperCase()}</span></div>
        <div class="body">
          <div class="meta">
            <span class="source">${escapeHtml(it.source)}</span>
            <span>${catLabel}</span>
            <span>· ${timeAgo(it.date)}</span>
          </div>
          <h2>${escapeHtml(it.title)}</h2>
          <p>${escapeHtml(desc)}${desc.length>=180?"…":""}</p>
          <a class="read" href="${escapeHtml(it.link)}" target="_blank" rel="noopener">
            ${rtl?'اقرأ المزيد':'Lees verder'} →
          </a>
        </div>
      </article>`;
  }).join("");
}

/* ---------- Kaart initialiseren ---------- */
function initMap(){
  if(map) return;
  map = L.map("map", {
    center: [25, 20],
    zoom: 3,
    worldCopyJump: true,
    zoomControl: true
  });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "© OpenStreetMap"
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

/* ---------- Kaart renderen ---------- */
function renderMap(){
  if(!map) initMap();
  markersLayer.clearLayers();

  const list = getFiltered();

  // Groepeer per bron zodat we 1 marker per zender hebben
  const bySource = {};
  list.forEach(it => {
    const key = it.source + "|" + it.lat + "," + it.lon;
    if(!bySource[key]) bySource[key] = { info: it, items: [] };
    bySource[key].items.push(it);
  });

  Object.values(bySource).forEach(group => {
    const { info, items } = group;
    const rtl = info.lang === "ar";

    // Kleur: groen = EN, oranje = AR
    const color = rtl ? "#f59e0b" : "#22c55e";
    const pulse = rtl ? "rgba(245,158,11,.8)" : "rgba(34,197,94,.8)";

    const icon = L.divIcon({
      className: "",
      html: `<div style="
        width:18px;height:18px;border-radius:50%;
        background:${color};border:2px solid #fff;
        box-shadow:0 0 0 0 ${pulse};
        animation:pinpulse 2s infinite;
        position:relative;
      ">
        <div style="
          position:absolute;top:-22px;left:50%;transform:translateX(-50%);
          background:${color};color:#00121f;font-weight:800;font-size:10px;
          padding:2px 6px;border-radius:6px;white-space:nowrap;
        ">${items.length}</div>
      </div>`,
      iconSize: [18,18],
      iconAnchor: [9,9]
    });

    const marker = L.marker([info.lat, info.lon], { icon }).addTo(markersLayer);

    // Popup met de 5 nieuwste artikelen van die zender
    const top = items.slice(0, 5);
    const popupHtml = `
      <div style="min-width:220px">
        <div class="src">${escapeHtml(info.source)} · ${items.length}</div>
        ${top.map(it => `
          <div style="margin-bottom:.5rem">
            <h3 dir="${isProbablyArabic(it.title)?'rtl':'ltr'}">${escapeHtml(it.title.slice(0,90))}${it.title.length>90?'…':''}</h3>
            <a href="${escapeHtml(it.link)}" target="_blank" rel="noopener">
              ${isProbablyArabic(it.title)?'اقرأ':'Lees'} →
            </a>
          </div>
        `).join("")}
      </div>`;
    marker.bindPopup(popupHtml);
  });
}

/* ---------- Weergave wisselen ---------- */
function switchView(v){
  currentView = v;
  if(v === "list"){
    listView.classList.add("active");
    mapView.classList.remove("active");
    viewListBtn.classList.add("active");
    viewMapBtn.classList.remove("active");
  } else {
    listView.classList.remove("active");
    mapView.classList.add("active");
    viewListBtn.classList.remove("active");
    viewMapBtn.classList.add("active");
    // Leaflet moet zich herberekenen na tonen
    setTimeout(() => {
      if(!map) initMap();
      map.invalidateSize();
      renderMap();
    }, 100);
  }
  localStorage.setItem("news_view", v);
}

/* ---------- Events ---------- */
searchEl.addEventListener("input", () => { render(); renderMap(); });

catsEl.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if(!chip) return;
  catsEl.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  activeCat = chip.dataset.cat;
  render(); renderMap();
});

langsEl.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if(!chip) return;
  langsEl.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  activeLang = chip.dataset.lang;
  render(); renderMap();
});

refreshEl.addEventListener("click", loadFeeds);
viewListBtn.addEventListener("click", () => switchView("list"));
viewMapBtn.addEventListener("click", () => switchView("map"));

/* Thema */
document.getElementById("theme").addEventListener("click", () => {
  document.body.classList.toggle("light");
  localStorage.setItem("news_theme",
    document.body.classList.contains("light") ? "light" : "dark");
});
if(localStorage.getItem("news_theme") === "light")
  document.body.classList.add("light");

/* Auto-refresh */
setInterval(loadFeeds, REFRESH_MS);

/* ---------- Start ---------- */
initMap();
const savedView = localStorage.getItem("news_view") || "list";
switchView(savedView);
loadFeeds();
</script>
</body>
</html>
